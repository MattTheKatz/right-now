<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Right Now</title>
<meta name="description" content="Your day, one block at a time.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Right Now">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#faf6ed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141109" media="(prefers-color-scheme: dark)">
<style>
  :root{
    --bg:#faf6ed; --card:#fffdf7; --card2:#f2ecdd; --line:#e3dac5;
    --ink:#282217; --muted:#7d7460; --accent:#e19b28; --accent-text:#8a5c06;
    --accent-contrast:#241703; --good:#5d8a4e; --good-text:#3f6633;
    --good-soft:rgba(93,138,78,.13); --accent-soft:rgba(225,155,40,.12);
    --sans:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#141109; --card:#1d1911; --card2:#262013; --line:#3a3220;
      --ink:#f0e8d5; --muted:#a3977b; --accent:#eaa63e; --accent-text:#f0ba60;
      --accent-contrast:#241703; --good:#93c47f; --good-text:#aed69a;
      --good-soft:rgba(147,196,127,.12); --accent-soft:rgba(234,166,62,.10);
    }
  }
  :root[data-theme="light"]{
    --bg:#faf6ed; --card:#fffdf7; --card2:#f2ecdd; --line:#e3dac5;
    --ink:#282217; --muted:#7d7460; --accent:#e19b28; --accent-text:#8a5c06;
    --accent-contrast:#241703; --good:#5d8a4e; --good-text:#3f6633;
    --good-soft:rgba(93,138,78,.13); --accent-soft:rgba(225,155,40,.12);
  }
  :root[data-theme="dark"]{
    --bg:#141109; --card:#1d1911; --card2:#262013; --line:#3a3220;
    --ink:#f0e8d5; --muted:#a3977b; --accent:#eaa63e; --accent-text:#f0ba60;
    --accent-contrast:#241703; --good:#93c47f; --good-text:#aed69a;
    --good-soft:rgba(147,196,127,.12); --accent-soft:rgba(234,166,62,.10);
  }

  :root{--alert:#b3402c}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--alert:#e8836a} }
  :root[data-theme="dark"]{--alert:#e8836a}
  :root[data-theme="light"]{--alert:#b3402c}

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; line-height:1.45;
  }
  .wrap{max-width:30rem; margin:0 auto;
    padding:calc(18px + env(safe-area-inset-top)) 16px calc(56px + env(safe-area-inset-bottom))}

  /* ---------- header ---------- */
  .topline{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .wordmark{font:700 11px/1 var(--mono); letter-spacing:.22em; color:var(--accent-text); text-transform:uppercase}
  .modebtn{
    font:600 12px var(--mono); color:var(--muted); background:none;
    border:1px solid var(--line); border-radius:999px; padding:7px 12px; cursor:pointer;
  }
  .modebtn:hover{color:var(--ink); border-color:var(--muted)}
  h1.date{font-size:26px; font-weight:800; letter-spacing:-.02em; margin:14px 0 10px; text-wrap:balance}
  .weekrow{display:flex; align-items:center; gap:14px; margin-bottom:20px}
  .dots{display:flex; gap:7px; align-items:center}
  .dot{width:11px; height:11px; border-radius:50%; border:1.5px solid var(--line); background:transparent}
  .dot.won{background:var(--good); border-color:var(--good)}
  .dot.today{box-shadow:0 0 0 2px var(--bg), 0 0 0 3.5px var(--accent)}
  .dot.fut{opacity:.45}
  .weeklabel{font:500 12px var(--mono); color:var(--muted); font-variant-numeric:tabular-nums}
  .storagewarn{
    font:500 12px var(--mono); color:var(--accent-text); background:var(--accent-soft);
    border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:14px;
  }

  /* ---------- tabs ---------- */
  .tabs{display:flex; gap:4px; background:var(--card2); border:1px solid var(--line);
    padding:4px; border-radius:999px; margin-bottom:18px}
  .tabs button{
    flex:1; font:600 13.5px var(--sans); color:var(--muted); background:none; border:0;
    border-radius:999px; padding:9px 0; cursor:pointer;
  }
  .tabs button[aria-current="true"]{background:var(--card); color:var(--ink);
    box-shadow:0 1px 2px rgba(0,0,0,.08)}

  /* ---------- now card ---------- */
  .won-banner{
    display:flex; align-items:center; gap:10px;
    background:var(--good-soft); border:1px solid var(--good);
    color:var(--good-text); border-radius:12px; padding:12px 14px;
    font-weight:600; font-size:14.5px; margin-bottom:14px;
  }
  .won-banner svg{flex:none}
  .now{
    background:linear-gradient(150deg, var(--card), var(--card2));
    border:1px solid var(--line); border-radius:16px; padding:20px 18px 8px;
  }
  .chip{
    display:inline-block; font:700 12.5px var(--mono); letter-spacing:.04em;
    background:var(--accent); color:var(--accent-contrast);
    padding:6px 11px; border-radius:999px; font-variant-numeric:tabular-nums;
  }
  .chip.quiet{background:var(--card2); color:var(--muted); border:1px solid var(--line)}
  .now h2{font-size:31px; font-weight:800; letter-spacing:-.025em; line-height:1.1;
    margin:14px 0 6px; text-wrap:balance}
  .why{color:var(--muted); font-size:14.5px; margin:0 0 12px; max-width:38ch}
  .tasks{margin:0 -6px}

  /* ---------- task rows ---------- */
  .task{
    display:flex; align-items:center; gap:13px; width:100%; text-align:left;
    background:none; border:0; border-top:1px solid var(--line);
    padding:13px 6px; min-height:50px; cursor:pointer;
    font:500 15.5px/1.35 var(--sans); color:var(--ink);
  }
  .task .box{
    width:25px; height:25px; flex:none; border-radius:8px;
    border:2px solid var(--muted); color:var(--bg);
    display:grid; place-items:center;
    transition:background .15s, border-color .15s;
  }
  .task:hover .box{border-color:var(--accent)}
  .task.done .box{background:var(--good); border-color:var(--good)}
  .task.done .box svg{animation:pop .2s ease-out}
  .task .lbl{transition:opacity .15s}
  .task.done .lbl{opacity:.5; text-decoration:line-through;
    text-decoration-thickness:1px; text-decoration-color:var(--muted)}
  .fchip{
    margin-left:auto; flex:none; font:700 9.5px var(--mono); letter-spacing:.14em;
    text-transform:uppercase; color:var(--accent-text);
    border:1px solid var(--accent-text); border-radius:999px; padding:3px 7px; opacity:.85;
  }
  .thint{margin-left:auto; flex:none; font:500 12px var(--mono); color:var(--muted)}
  @keyframes pop{from{transform:scale(.5)}to{transform:scale(1)}}

  /* ---------- inbox ---------- */
  .inbox{background:var(--card); border:1px solid var(--line);
    border-left:3px solid var(--accent); border-radius:14px;
    padding:15px 16px 13px; margin-bottom:16px}
  .inbox-h{display:flex; align-items:baseline; justify-content:space-between;
    gap:10px; margin-bottom:4px}
  .inbox-t{font:700 11px var(--mono); letter-spacing:.2em; text-transform:uppercase;
    color:var(--accent-text)}
  .inbox-age{font:500 11.5px var(--mono); color:var(--muted)}
  .inbox-i{display:flex; gap:10px; align-items:baseline; padding:9px 0;
    border-top:1px solid var(--line); font-size:14.5px; line-height:1.35}
  .inbox-who{font:600 11px var(--mono); color:var(--muted); text-transform:uppercase;
    letter-spacing:.08em; flex:none; width:52px; padding-top:2px}
  .inbox-due{margin-left:auto; flex:none; font:600 11.5px var(--mono);
    color:var(--muted); white-space:nowrap; padding-top:2px}
  .inbox-due.soon{color:var(--alert)}
  .inbox-foot{font-size:12.5px; color:var(--muted); margin-top:11px}
  .inbox-clear{font-size:14px; color:var(--good-text); font-weight:600; margin:4px 0 0}
  .inbox-stale{font-size:13px; color:var(--muted); margin:4px 0 0}

  .inbox.coming{border-left-color:var(--good)}
  .inbox.coming .inbox-t{color:var(--good-text)}

  /* ---------- agenda ---------- */
  .ag-add{display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    background:var(--card2); border:1px dashed var(--line); border-radius:12px;
    padding:13px; margin-bottom:16px; cursor:pointer;
    font:600 14px var(--sans); color:var(--accent-text)}
  .ag-add:hover{border-color:var(--accent); background:var(--accent-soft)}
  .ag-form{background:var(--card); border:1px solid var(--accent); border-radius:14px;
    padding:15px; margin-bottom:16px; display:flex; flex-direction:column; gap:11px}
  .ag-form input[type=text], .ag-form input[type=date]{
    width:100%; font:500 15px var(--sans); color:var(--ink);
    background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:11px 12px}
  .ag-form input:focus{outline:2px solid var(--accent); outline-offset:-1px}
  .seg{display:flex; gap:4px; background:var(--card2); border:1px solid var(--line);
    border-radius:999px; padding:3px}
  .seg button{flex:1; font:600 12.5px var(--sans); color:var(--muted); background:none;
    border:0; border-radius:999px; padding:8px 0; cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-contrast)}
  .dayrow{display:flex; gap:5px}
  .dayrow button{flex:1; font:600 12px var(--mono); color:var(--muted); background:var(--card2);
    border:1px solid var(--line); border-radius:8px; padding:9px 0; cursor:pointer}
  .dayrow button[aria-pressed="true"]{background:var(--accent); color:var(--accent-contrast);
    border-color:var(--accent)}
  .ag-btns{display:flex; gap:8px; justify-content:flex-end}
  .ag-btns button{font:600 14px var(--sans); border-radius:999px; padding:10px 20px;
    cursor:pointer; border:1px solid var(--line); background:var(--card2); color:var(--muted)}
  .ag-btns button.go{background:var(--accent); color:var(--accent-contrast); border-color:var(--accent)}

  .ag-sec{margin-bottom:22px}
  .ag-sec h3{font:700 11px var(--mono); letter-spacing:.18em; text-transform:uppercase;
    color:var(--muted); margin:0 2px 9px}
  .ag-list{background:var(--card); border:1px solid var(--line); border-radius:14px;
    overflow:hidden}
  .ag-i{display:flex; align-items:flex-start; gap:12px; padding:12px 14px;
    border-top:1px solid var(--line); min-height:48px}
  .ag-i:first-child{border-top:0}
  .ag-chk{flex:none; width:23px; height:23px; margin-top:1px; border-radius:7px;
    border:2px solid var(--muted); background:none; color:var(--bg);
    display:grid; place-items:center; cursor:pointer; padding:0}
  .ag-chk:hover{border-color:var(--accent)}
  .ag-i.on .ag-chk{background:var(--good); border-color:var(--good)}
  .ag-txt{flex:1; font:500 15px/1.35 var(--sans); color:var(--ink);
    background:none; border:0; text-align:left; padding:0; cursor:default}
  .ag-i.on .ag-txt{opacity:.45; text-decoration:line-through;
    text-decoration-thickness:1px; text-decoration-color:var(--muted)}
  .ag-when{display:block; font:600 11.5px var(--mono); color:var(--muted); margin-top:3px;
    text-decoration:none}
  .ag-when.soon{color:var(--accent-text)}
  .ag-when.late{color:var(--alert)}
  .ag-when.today{color:var(--good-text)}
  .ag-src{flex:none; align-self:center; font:700 9px var(--mono); letter-spacing:.12em;
    text-transform:uppercase; color:var(--muted); border:1px solid var(--line);
    border-radius:999px; padding:3px 6px}
  .ag-tag{display:inline-block; font:700 9.5px var(--mono); letter-spacing:.08em;
    text-transform:uppercase; color:var(--accent-text); background:var(--accent-soft);
    border-radius:5px; padding:2px 6px; margin-right:7px; vertical-align:1px}
  .ag-del{flex:none; align-self:center; background:none; border:0; cursor:pointer;
    color:var(--muted); font:500 17px var(--sans); line-height:1; padding:4px 6px}
  .ag-del:hover{color:var(--alert)}
  .ag-empty{font-size:13.5px; color:var(--muted); padding:14px; text-align:center}
  .ag-note{font-size:12.5px; color:var(--muted); margin:0 2px 18px}

  .upnext{font:500 13px var(--mono); color:var(--muted); margin:12px 2px 22px}
  .upnext b{color:var(--accent-text); font-weight:600}

  .catch{display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin:14px 2px 0}
  .catch-l{font:600 12px var(--mono); color:var(--muted); letter-spacing:.03em}
  .pill{
    font:600 13px var(--sans); color:var(--accent-text); background:var(--accent-soft);
    border:1px solid var(--accent-text); border-radius:999px; padding:7px 13px; cursor:pointer;
  }

  /* ---------- timeline ---------- */
  .tl-wrap{background:var(--card); border:1px solid var(--line); border-radius:14px;
    overflow:hidden}
  .tl+.tl{border-top:1px solid var(--line)}
  .tl-h{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:none; border:0; padding:13px 14px; min-height:50px; cursor:pointer;
    font:500 15px var(--sans); color:var(--ink);
  }
  .tl.cur .tl-h{background:var(--accent-soft)}
  .tl-time{font:600 12.5px var(--mono); color:var(--muted); width:62px; flex:none;
    font-variant-numeric:tabular-nums}
  .tl.cur .tl-time{color:var(--accent-text)}
  .tl-title{flex:1}
  .tl.cur .tl-title{font-weight:700}
  .tl-count{font:500 12px var(--mono); color:var(--muted); font-variant-numeric:tabular-nums}
  .tl-count.full{color:var(--good-text); font-weight:700}
  .chev{flex:none; color:var(--muted); transition:transform .15s}
  .chev.open{transform:rotate(180deg)}
  .tl-tasks{padding:0 14px 6px 14px; background:color-mix(in srgb, var(--card2) 45%, transparent)}
  .sectionlabel{font:700 11px var(--mono); letter-spacing:.18em; text-transform:uppercase;
    color:var(--muted); margin:0 2px 10px}

  /* ---------- goals ---------- */
  .wkline{font:500 12.5px var(--mono); color:var(--muted); margin:0 2px 14px}
  .gcard{background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:18px 16px 6px; margin-bottom:14px}
  .eyebrow{font:700 11px var(--mono); letter-spacing:.2em; color:var(--accent-text);
    text-transform:uppercase; margin-bottom:8px}
  .vision{font-size:16.5px; font-weight:700; letter-spacing:-.01em; margin:0 0 6px;
    text-wrap:balance}
  .phase{color:var(--muted); font-size:13.5px; margin:0 0 10px}
  .gnote{font-size:13px; color:var(--muted); margin:6px 2px 0}

  /* ---------- today / tomorrow switch ---------- */
  .tlhead{display:flex; align-items:center; gap:6px; margin:0 2px 10px}
  .tlhead button{font:700 11px var(--mono); letter-spacing:.18em; text-transform:uppercase;
    color:var(--muted); background:none; border:0; padding:4px 2px; cursor:pointer}
  .tlhead button[aria-current="true"]{color:var(--ink)}
  .tlhead .sep{color:var(--line); font-size:12px}
  .tlhead .dl{margin-left:auto; font:500 11.5px var(--mono); color:var(--muted);
    text-transform:none; letter-spacing:0}
  .tl-ro .tl-h{cursor:default}
  .tl-ro .tl-count{display:none}
  .rotask{display:flex; gap:11px; align-items:flex-start; padding:9px 6px;
    border-top:1px solid var(--line); font:500 14.5px/1.35 var(--sans); color:var(--muted)}
  .rodot{flex:none; width:6px; height:6px; border-radius:50%; background:var(--line);
    margin-top:7px}

  /* ---------- grades ---------- */
  .gr{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 10px; margin-bottom:6px;
    -webkit-overflow-scrolling:touch}
  .gr-i{flex:none; min-width:88px; background:var(--card); border:1px solid var(--line);
    border-top:3px solid var(--good); border-radius:11px; padding:9px 11px}
  .gr-i.mid{border-top-color:var(--accent)}
  .gr-i.low{border-top-color:var(--alert)}
  .gr-i.none{border-top-color:var(--line)}
  .gr-c{font:700 10px var(--mono); letter-spacing:.1em; color:var(--muted);
    text-transform:uppercase; white-space:nowrap}
  .gr-s{font:800 19px var(--sans); letter-spacing:-.02em; margin-top:3px;
    font-variant-numeric:tabular-nums}
  .gr-s.dim{font-size:13px; font-weight:600; color:var(--muted); padding:4px 0 2px}
  .gr-when{font:500 11.5px var(--mono); color:var(--muted); margin:0 2px 14px}

  /* ---------- workout log ---------- */
  .wo-l{border-top:1px solid var(--line); margin:2px -16px 0; padding:14px 16px 6px;
    background:color-mix(in srgb, var(--card2) 45%, transparent)}
  .wo-top{display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    margin-bottom:10px}
  .wo-cnt{font:700 10.5px var(--mono); letter-spacing:.16em; text-transform:uppercase;
    color:var(--muted)}
  .wo-next{font:700 12px var(--mono); color:var(--accent-text)}
  .wo-last{display:flex; gap:9px; align-items:baseline; font-size:13.5px; margin:6px 0}
  .wo-ex{flex:1; color:var(--muted)}
  .wo-val{font:600 12.5px var(--mono); color:var(--ink); font-variant-numeric:tabular-nums}
  .wo-up{font:600 12.5px var(--mono); color:var(--good-text)}
  .wo-btn{display:block; width:100%; margin:12px 0 4px; padding:12px;
    background:var(--accent); color:var(--accent-contrast); border:0; border-radius:10px;
    font:700 14px var(--sans); cursor:pointer}
  .wo-form{display:flex; flex-direction:column; gap:10px; margin:10px 0 4px}
  .wo-row{display:flex; align-items:center; gap:10px}
  .wo-row label{flex:1; font-size:13.5px}
  .wo-row input{width:118px; flex:none; font:600 13px var(--mono); color:var(--ink);
    background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:9px 10px}
  .wo-row input:focus{outline:2px solid var(--accent); outline-offset:-1px}
  .wo-hint{font-size:12.5px; color:var(--muted); margin:0}
  .wo-none{font-size:13px; color:var(--muted); margin:2px 0 8px}

  /* ---------- money ---------- */
  .mny{border-top:1px solid var(--line); margin:2px -16px 0; padding:14px 16px 4px;
    background:color-mix(in srgb, var(--card2) 45%, transparent)}
  .mny-h{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
  .mny-p{font:700 10.5px var(--mono); letter-spacing:.16em; text-transform:uppercase;
    color:var(--muted)}
  .mny-n{font:800 25px var(--sans); letter-spacing:-.02em; font-variant-numeric:tabular-nums}
  .mny-t{font:600 12px var(--mono); color:var(--muted); font-variant-numeric:tabular-nums}
  .mny-track{height:6px; background:var(--card2); border:1px solid var(--line);
    border-radius:999px; overflow:hidden; margin:9px 0 12px}
  .mny-fill{height:100%; background:var(--good); border-radius:999px}
  .mny-fill.over{background:var(--alert)}
  .mny-c{display:flex; align-items:center; gap:9px; font-size:13.5px; margin:7px 0}
  .mny-bar{flex:1; height:5px; background:var(--card2); border-radius:999px; overflow:hidden}
  .mny-bar span{display:block; height:100%; background:var(--accent); border-radius:999px}
  .mny-amt{font:600 12.5px var(--mono); color:var(--muted); font-variant-numeric:tabular-nums;
    min-width:44px; text-align:right}
  .mny-note{font-size:13px; color:var(--muted); margin:11px 0 8px; max-width:42ch}
  .mny-none{font-size:13px; color:var(--muted); margin:2px 0 8px}

  /* ---------- plan ---------- */
  .pcard{background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:18px 16px; margin-bottom:14px}
  .pcard h3{font-size:17px; font-weight:800; letter-spacing:-.01em; margin:0 0 10px}
  .pcard p{font-size:14px; color:var(--muted); margin:8px 0 0}
  .pcard p b{color:var(--ink)}
  .pcard ol, .pcard ul{margin:0; padding-left:20px; font-size:14.5px}
  .pcard li{margin:7px 0}
  .pcard li b{font-weight:700}
  .floorlist{list-style:none; padding:0}
  .floorlist li{display:flex; gap:10px; align-items:baseline; margin:9px 0; font-size:15px}
  .floorlist .n{font:700 12px var(--mono); color:var(--accent-text); flex:none}
  .tablewrap{overflow-x:auto; margin:4px -4px 0}
  table.sched{border-collapse:collapse; width:100%; font-size:13.5px}
  table.sched td{padding:7px 10px 7px 4px; border-top:1px solid var(--line); vertical-align:top}
  table.sched td.t{font:600 12px var(--mono); color:var(--muted); white-space:nowrap;
    font-variant-numeric:tabular-nums}
  table.sched td.n{color:var(--muted); font-size:12.5px}
  .wo{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:10px}
  .wo>div{background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:12px}
  .wo h4{font:700 11px var(--mono); letter-spacing:.16em; color:var(--accent-text);
    margin:0 0 8px; text-transform:uppercase}
  .wo ul{list-style:none; padding:0; margin:0; font-size:13.5px}
  .wo li{margin:6px 0}
  @media (max-width:420px){.wo{grid-template-columns:1fr}}

  footer{margin-top:26px; text-align:center;
    font:500 11.5px var(--mono); color:var(--muted); letter-spacing:.03em}

  button:focus-visible, .task:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:8px}
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important}
  }
</style>

<body>
<div class="wrap" id="app"></div>

<script>
(function(){
  'use strict';

  /* Fall 2026: UTD classes begin Mon Aug 24 — the app switches schedules automatically. */
  var SEMESTER_START = new Date(2026,7,24);

  /* Preview hook: append ?t=2026-08-25T10:30 to see any moment's schedule. */
  var TP=null;
  try{ TP=new URLSearchParams(location.search).get('t'); }catch(e){}
  var nowDate=function(){ return TP ? new Date(TP) : new Date(); };

  /* ---------- storage (with in-memory fallback) ---------- */
  var store = (function(){
    try{
      localStorage.setItem('rn1:t','1'); localStorage.removeItem('rn1:t');
      return {get:function(k){return localStorage.getItem(k)},
              set:function(k,v){localStorage.setItem(k,v)}, live:true};
    }catch(e){
      var m={};
      return {get:function(k){return (k in m)?m[k]:null},
              set:function(k,v){m[k]=v}, live:false};
    }
  })();

  /* ---------- helpers ---------- */
  var pad=function(n){return String(n).padStart(2,'0')};
  var dkey=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
  var mins=function(t){var p=t.split(':');return (+p[0])*60+(+p[1])};
  var fmt=function(t){
    var p=t.split(':'), h=+p[0], m=+p[1], am=h<12;
    h=h%12; if(h===0)h=12;
    return h+':'+pad(m)+(am?'am':'pm');
  };
  var monday=function(d){
    var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
    x.setDate(x.getDate()-((x.getDay()+6)%7));
    return x;
  };
  var weekKeys=function(mon){
    var out=[],i,y;
    for(i=0;i<7;i++){y=new Date(mon); y.setDate(mon.getDate()+i); out.push(dkey(y));}
    return out;
  };

  var MIN_IDS=['m-up','m-teeth','m-walk','m-rep','m-bed'];

  var dayState=function(k){
    var s;
    try{ s=JSON.parse(store.get('rn1:d:'+k)); }catch(e){ s=null; }
    if(!s||typeof s!=='object') s={};
    if(!s.checks) s.checks={};
    return s;
  };
  var saveDay=function(k,s){ store.set('rn1:d:'+k, JSON.stringify(s)); };
  var weekState=function(k){
    var s;
    try{ s=JSON.parse(store.get('rn1:w:'+k)); }catch(e){ s=null; }
    if(!s||typeof s!=='object') s={};
    if(!s.checks) s.checks={};
    return s;
  };
  var saveWeek=function(k,s){ store.set('rn1:w:'+k, JSON.stringify(s)); };
  var isWon=function(k){
    var s=dayState(k);
    return MIN_IDS.every(function(id){return !!s.checks[id]});
  };

  /* ---------- block builders ---------- */
  var B=function(id,s,e,title,why,tasks){return {id:id,s:s,e:e,title:title,why:why,tasks:tasks}};
  var SEASON_WHY='New-grad 2027 postings are open right now. Early applications count double.';

  var wakeB=function(s,e,hint){return B('wake',s,e,'Wake up',
    "Don't negotiate with the bed. Feet on the floor first — everything is easier after.",
    [{id:'m-up',label:'Out of bed + drink the water by your bed',min:true,short:'Water',hint:hint},
     {id:'wake.1',label:'Open the blinds — real light in your eyes'},
     {id:'wake.2',label:"Stay off the phone until you're vertical"}]);};
  var humanB=function(s,e,noShower){return B('human',s,e,'Get human',
    noShower?'You showered last night. This is teeth, clothes, go.'
            :"You act like the person you're dressed as.",
    noShower?[{id:'m-teeth',label:'Brush teeth',min:true,short:'Teeth',hint:'morning'},
              {id:'human.1',label:'The clothes you laid out last night'}]
            :[{id:'m-teeth',label:'Brush teeth',min:true,short:'Teeth',hint:'morning'},
              {id:'human.1',label:'Shower'},
              {id:'human.2',label:'Real clothes + make the bed'}]);};
  var commuteB=function(s,e,why,bagLabel){return B('transit',s,e,'Drive in + walk from the lot',why,
    [{id:'transit.0',label:bagLabel},
     {id:'m-walk',label:'The walk in from the lot — that\'s your 15 minutes outside',min:true,short:'Walk',hint:'the lot walk'}]);};
  var breakfastB=function(s,e,quick){return B('breakfast',s,e,quick?'Quick breakfast':'Breakfast',
    'Half of getting ripped happens at meals.',
    quick?[{id:'breakfast.0',label:'Protein even in a hurry — a shake and a banana counts'}]
         :[{id:'breakfast.0',label:'Something with protein — eggs, Greek yogurt, a shake'},
           {id:'breakfast.1',label:'Coffee with food, not instead of it'}]);};
  var careerB=function(s,e,why){return B('career',s,e,'Career block',why,
    [{id:'m-rep',label:'One job rep: submit 1 application or solve 1 problem',min:true,short:'Job rep',hint:'anytime'},
     {id:'career.1',label:'2 more applications (Simplify new-grad list)'},
     {id:'career.2',label:'1 LeetCode from NeetCode 150 (easies first)'}]);};
  var walkB=function(s,e,hint){return B('walk',s,e,'Walk',
    "Sun and steps fix more brain chemistry than you'd expect.",
    [{id:'m-walk',label:'10–20 minutes outside — no destination needed',min:true,short:'Walk',hint:hint}]);};
  var lunchB=function(s,e){return B('lunch',s,e,'Lunch','',
    [{id:'lunch.0',label:'Real food, protein again'},
     {id:'lunch.1',label:'Eat away from the screen'}]);};
  var studyB=function(s,e){return B('study',s,e,'Study block',
    "Grades are a byproduct of starting before it's urgent.",
    [{id:'study.0',label:'90 minutes on assignments — hardest class first'},
     {id:'study.1',label:'Log one line: what did today add?'}]);};
  var liftB=function(s,e){return B('workout',s,e,'Lift day',
    'Ripped is about 150 ordinary workouts away. This is one of them.',
    [{id:'workout.0',label:'Workout A or B — see the Plan tab (~45 min)'},
     {id:'workout.1',label:'Log your weights (notes app is fine)'}]);};
  /* Lydia's Hadestown rehearsals — she needs a ride both ways. Real dates, not every Friday. */
  var HADESTOWN={
    '2026-08-28':'Rehearsal 3','2026-09-04':'Rehearsal','2026-09-11':'Rehearsal 4',
    '2026-09-18':'Rehearsal 5','2026-09-25':'Rehearsal 6','2026-10-02':'Rehearsal 7',
    '2026-10-16':'Rehearsal 9','2026-10-23':'Rehearsal 10','2026-10-30':'Rehearsal 11',
    '2026-11-13':'Rehearsal 13','2026-12-04':'Rehearsal 14','2026-12-11':'Rehearsal 15',
    '2027-01-08':'Rehearsal 16'
  };
  var rideB=function(label){return B('ride','16:40','18:45','Driving Lydia — '+label,
    'She is on at 5:00 and out at 6:30. The 90 minutes in between are yours, not dead time.',
    [{id:'ride.0',label:'Leave by 4:40 so she is not rushed'},
     {id:'ride.1',label:'Bring the horn or the laptop — 90 minutes is a full practice or a career block'},
     {id:'ride.2',label:'Back at 6:30, then the evening is yours together'}]);};
  var TR=[{id:'trumpet.0',label:'The daily routine — see the Plan tab'},
          {id:'trumpet.1',label:'Log it so the streak stays visible'}];
  var trumpetB=function(s,e,why,tasks){return B('trumpet',s,e,'Trumpet',why,tasks||TR);};
  var moveB=function(s,e){return B('workout',s,e,'Move day',
    'Easy days are where the hard days pay out.',
    [{id:'workout.0',label:'30+ minutes: long walk, bike, hoop, swim — anything'}]);};
  var dinnerB=function(s,e){return B('dinner',s,e,'Dinner',
    'Cooking is a money skill, a health skill, and honestly a date skill.',
    [{id:'dinner.0',label:'Cook it yourself: protein + carb + something green'}]);};
  var freeB=function(s,e,why){return B('free',s,e,'Free',why,
    [{id:'free.0',label:'Whatever you want — zero guilt'}]);};
  var eveningB=function(s,e){return B('evening',s,e,'Evening — yours',
    "Be where your feet are. The job hunt is on tomorrow's schedule, not tonight's.",
    [{id:'evening.0',label:'Girlfriend, friends, games — fully off the clock'}]);};
  var shutdownB=function(s,e,bedLabel,why,extras){
    var t=(extras||[]).concat([
      {id:'shutdown.0',label:'Refill the water glass, set it by the bed'},
      {id:'shutdown.1',label:'Phone on the charger, out of arm\'s reach'},
      {id:'shutdown.2',label:'Stage tomorrow: bag packed, clothes out, 30-second look at this app'},
      {id:'m-bed',label:bedLabel,min:true,short:'Lights out',hint:'tonight'}]);
    return B('shutdown',s,e,'Shutdown',
      why||'Tomorrow is decided right now, not in the morning.',t);};
  var SWEEP={id:'shutdown.inbox',label:'Inbox sweep — open Claude and say /inbox (5 min)'};
  var SHOWER={id:'shutdown.shower',label:'Shower tonight — it buys you 20 minutes at 7am'};
  var reviewB=function(s,e){return B('review',s,e,'Weekly review',
    'Twenty minutes of steering saves a week of drifting.',
    [{id:'review.0',label:'Open Claude Code in C:\\Life and say "weekly review"'},
     {id:'review.1',label:'Adjust the plan together, refresh the week goals'}]);};
  var classB=function(id,s,e,title,room,note){return B(id,s,e,title,
    room+(note?' — '+note:''),
    [{id:id+'.0',label:'In the seat by '+fmt(s)},
     {id:id+'.1',label:'Phone stays in the bag'}]);};

  /* ---------- summer (through Aug 23) ---------- */
  var summerBlocks=function(dow){
    var workout = (dow===0) ? B('workout','16:30','17:45','Rest day',
        'Rest is the program. The muscle you worked this week gets built today.',
        [{id:'workout.0',label:'Optional: stretch 10 minutes'}])
      : (dow===1||dow===3||dow===5) ? liftB('16:30','17:45')
      : moveB('16:30','17:45');
    var build = (dow===0) ? reviewB('13:30','15:00')
      : B('build','13:30','15:00','Build block',
        'A project you can demo beats a fourth resume bullet.',
        [{id:'build.0',label:'90 focused minutes: project, more applications, or interview prep'},
         {id:'build.1',label:'Log one line: what did today add?'}]);
    return [
      wakeB('09:00','09:20','by 9:30am'),
      humanB('09:20','10:00'),
      breakfastB('10:00','10:45',false),
      careerB('10:45','12:15',SEASON_WHY),
      lunchB('12:15','13:00'),
      walkB('13:00','13:30','anytime'),
      build,
      freeB('15:00','16:30','The work happened this morning. This is yours.'),
      workout,
      dinnerB('17:45','19:00'),
      eveningB('19:00','22:30'),
      shutdownB('22:30','23:00','In bed, lights out by 11:30')
    ];
  };

  /* ---------- semester (from Aug 24) ---------- */

      return [
        wakeB('07:00','07:15','first thing'),
        humanB('07:15','07:35',true),
        breakfastB('07:35','07:50',true),
        commuteB('07:50','08:30',
          'Door to seat is about 35 minutes. Leaving at 7:50 is the whole difference between walking in and sprinting in.',
          'Bag was packed last night — grab and go'),
        classB('cs4390','08:30','09:45','CS 4390 · Networks','JSOM 1.110','the 8:30 is brutal; go anyway'),
        careerB('09:45','11:30','That 105-minute gap is the best career block of your week — you\'re already on campus. Library or an ECSS lounge.'),
        classB('cs4349','11:30','12:45','CS 4349 · Algorithms','ECSS 2.415','this class IS interview prep'),
        lunchB('12:45','13:45'),
        studyB('13:45','15:15'),
        B('reset','15:15','15:45','Reset',
          'Long evening still ahead. Refuel now, not at 10pm.',
          [{id:'reset.0',label:'Water and something with protein'},
           {id:'reset.1',label:'Five minutes of actual nothing'}])
      ];
    };
    if(dow===1||dow===3){ /* Mon, Wed */
      return [
        wakeB('08:00','08:20','first thing'),
        humanB('08:20','08:50'),
        breakfastB('08:50','09:15',false),
        commuteB('09:15','10:00',
          'Door to seat is about 35 minutes. Out by 9:15 and you arrive calm.',
          'Bag: laptop, charger, water bottle'),
        classB('cs4391','10:00','11:15','CS 4391 · Computer Vision','ECSS 2.415','attendance is most of the grade in disguise'),
        lunchB('11:15','12:00'),
        careerB('12:00','13:30','You\'re on campus till the 4:30 lift anyway — this is found time, not extra time.'),
        studyB('13:30','15:00'),
        trumpetB('15:00','15:45','Book a practice room while you are already on campus — it never happens once you get home.'),
        freeB('15:45','16:30','Earned. Stay on campus — the gym is right there.'),
        liftB('16:30','17:45'),
        dinnerB('17:45','19:00'),
        eveningB('19:00','22:00'),
        shutdownB('22:00','22:30','In bed, lights out by 11:00 — tomorrow starts at 7:00',
          'Tomorrow is an 8:30 class. Win it tonight.',[SHOWER,SWEEP])
      ];
    }
    if(dow===2){ /* Tue — the gauntlet */
      return tthHead().concat([
        freeB('15:45','16:45','Breather before the evening run.'),
        B('dinner','16:45','17:30','Early dinner',
          'Long night ahead — eat now, not at 10pm.',
          [{id:'dinner.0',label:'Real meal, protein — 9:30pm-you says thanks'}]),
        classB('cs4348','17:30','18:45','CS 4348 · Operating Systems','ECSW 1.365',null),
        B('musi','18:45','21:45','MUSI 3120 · Ensemble',
          'PHY 1.304 — the fun one. Music is not a wasted Tuesday.',
          [{id:'musi.0',label:'Be there by 7:00'}]),
        shutdownB('21:45','22:30','In bed, lights out by 11:00',
          'Tuesday is the gauntlet — and you just survived it. Straight to bed.',[SWEEP])
      ]);
    }
    if(dow===4){ /* Thu */
      return tthHead().concat([
        trumpetB('15:45','16:30','A horn and 45 free minutes before the 5:30 class. Practice rooms are right there.'),
        freeB('16:30','17:30','Or get ahead on assignments — Friday-you will notice.'),
        classB('cs4348','17:30','18:45','CS 4348 · Operating Systems','ECSW 1.365',null),
        B('dinner','18:45','19:45','Dinner',
          'Cooking is a money skill, a health skill, and honestly a date skill.',
          [{id:'dinner.0',label:'Cook it yourself: protein + carb + something green'},
           {id:'trash-thu',label:'Trash bin out if you got home before 6 — otherwise it waits for Sunday'}]),
        B('evening','19:45','22:00','Evening — yours','Thursday night is earned.',
          [{id:'evening.0',label:'Girlfriend, friends, games — fully off the clock'}]),
        shutdownB('22:00','22:30','In bed, lights out by 11:30',null,[SWEEP])
      ]);
    }
    if(dow===5){ /* Fri — no classes */
      return [
        wakeB('08:00','08:20','first thing'),
        humanB('08:20','08:50'),
        breakfastB('08:50','09:30',false),
        careerB('09:30','11:00',SEASON_WHY),
        B('build','11:00','12:30','Build block',
          "Clear the week's leftovers, then the weekend is truly free.",
          [{id:'build.0',label:'Assignments first, then project or interview prep'},
           {id:'build.1',label:'Log one line: what did this week add?'}]),
        lunchB('12:30','13:15'),
        walkB('13:15','13:45','anytime'),
        liftB('13:45','15:00'),
        trumpetB('15:00','15:45','Full routine while you are fresh — Friday is your longest practice window.'),
        freeB('15:45','16:40','Earned. Lift and practice are already done.')
      ].concat(HADESTOWN[dk] ? [
        rideB(HADESTOWN[dk]),
        B('evening','18:45','23:00','Date night',
          'You just picked her up — go straight into it. Standing slot, planned by you.',
          [{id:'evening.0',label:'All-in: plan made, phone down'}]),
        shutdownB('23:00','23:30','In bed by 12:30 — weekend rules')
      ] : [
        B('dinner','16:40','19:00','Dinner — or date-night prep','',
          [{id:'dinner.0',label:'Cook together if she is over — that counts double'}]),
        B('evening','19:00','23:00','Date night',
          'Friday is the standing date slot — planned by you.',
          [{id:'evening.0',label:'All-in: plan made, phone down'}]),
        shutdownB('23:00','23:30','In bed by 12:30 — weekend rules')
      ]);
    }
    if(dow===6){ /* Sat */
      return [
        wakeB('09:00','09:20','by 9:30am'),
        humanB('09:20','10:00'),
        breakfastB('10:00','10:45',false),
        walkB('10:45','11:15','anytime'),
        trumpetB('11:15','11:45','Short and easy. Chops respond to frequency far more than to long sessions.',
          [{id:'trumpet.0',label:'Warm-up, flexibility, then something you actually enjoy playing'}]),
        B('career','11:45','12:15','One job rep',
          'Keeps the pipeline warm without eating the weekend.',
          [{id:'m-rep',label:'1 application or 1 problem — then close the laptop',min:true,short:'Job rep',hint:'before noon'}]),
        B('free','12:15','23:00','Free day','This is the point of the whole system.',
          [{id:'free.0',label:'Move 30+ min somewhere in here — hoop, bike, long walk'},
           {id:'free.1',label:'Friends, girlfriend, fun'}]),
        shutdownB('23:00','23:30','In bed by 12:30 — weekend rules')
      ];

    /* Sun */
    return [
      wakeB('09:00','09:20','by 9:30am'),
      humanB('09:20','10:00'),
      breakfastB('10:00','10:45',false),
      B('slow','10:45','12:45','Meal prep',
        'Two hours here buys you five days of not deciding what to eat. Full walkthrough in the Plan tab.',
        [{id:'slow.0',label:'Oven 425°F — chicken 22 min, veg 20 min'},
         {id:'slow.1',label:'Rice on · ground meat browned · potatoes in the air fryer'},
         {id:'slow.2',label:'5 overnight oats jars'},
         {id:'slow.3',label:'Assemble 5 lunches + 5 dinners, cool before lidding'}]),
      B('career','12:45','13:30','One job rep',
        'One rep before the review keeps the streak honest.',
        [{id:'m-rep',label:'1 application or 1 problem',min:true,short:'Job rep',hint:'before review'}]),
      reviewB('13:30','15:00'),
      walkB('15:00','15:30','anytime'),
      trumpetB('15:30','15:55','Light day — warm-up and long tones only. Rest is when chops actually rebuild.',
        [{id:'trumpet.0',label:'Easy playing only. No range work today.'}]),
      B('free','15:55','17:45','Free',
        'Rest day — the muscle gets built today. Also the one reliable trash night.',
        [{id:'trash',label:'Valet trash: bin outside the door between 4 and 6'},
         {id:'free.0',label:'Whatever you want — zero guilt'}]),
      dinnerB('17:45','19:00'),
      B('evening','19:00','21:30','Evening — easy','School week starts tomorrow.',
        [{id:'evening.0',label:'Wind down early tonight'}]),
      shutdownB('21:30','22:00','In bed, lights out by 11:00 — Monday starts at 8:00',
        'Sunday night sets the whole week. Sweep the inbox so Monday has no surprises.',[SWEEP])
    ];
  };

  /* One-off timed items from the agenda become real blocks, carving out
     whatever they overlap so nothing ends up shadowed. */
  var injectEvent=function(blocks,ev){
    var es=mins(ev.s), ee=mins(ev.e), out=[];
    blocks.forEach(function(b){
      var bs=mins(b.s), be=mins(b.e);
      if(be<=es||bs>=ee){ out.push(b); return; }
      if(bs<es) out.push({id:b.id,s:b.s,e:ev.s,title:b.title,why:b.why,tasks:b.tasks});
      if(be>ee) out.push({id:b.id+'~after',s:ev.e,e:b.e,title:b.title,why:b.why,tasks:b.tasks});
    });
    out.push(ev);
    out.sort(function(x,y){ return mins(x.s)-mins(y.s); });
    return out;
  };

  var dayBlocks=function(d){
    var base=(d.getTime()>=SEMESTER_START.getTime())
      ? semesterBlocks(d.getDay(),dkey(d))
      : summerBlocks(d.getDay());
    var dk=dkey(d);
    (agendaRepo||[]).concat(myItems()).forEach(function(it){
      if(it.date!==dk||!it.start||!it.end) return;
      base=injectEvent(base, B('ev:'+it.id, it.start, it.end,
        it.title||String(it.text).slice(0,34),
        it.text||'',
        [{id:'ev:'+it.id+'.0', label:it.todo||it.text}]));
    });
    return base;
  };

  /* ---------- goals ---------- */
  var GOALS=[
    {id:'body',tag:'Body',
     vision:'Lean and strong — the guy who obviously lifts.',
     phase:'Now (Aug–Oct): build the habit, learn the lifts, eat protein. Consistency now, abs later.',
     week:['Lift 3× — Mon / Wed / Fri at 4:30','Stock the new kitchen: eggs, chicken, rice, yogurt, frozen veg','Protein at every meal','One weigh-in: baseline, zero judgment']},
    {id:'career',tag:'Career',
     vision:'Signed SWE offer before May 2027 graduation.',
     phase:'Now: peak new-grad season, and it overlaps week one of classes. Protect the campus gap — that\'s the block that survives a busy week.',
     week:['Resume rebuilt — one page','6 applications (Simplify new-grad list)','4 LeetCode easies (NeetCode 150)','Find the ECS career fair date on Handshake']},
    {id:'money',tag:'Money',
     vision:'High savings rate from day one of the job — early retirement and three kids become math problems with known answers.',
     phase:"Now: see clearly. New apartment means new fixed costs — get them on paper before they get away from you.",
     week:['30-minute money map with Claude (accounts, debts, monthly burn)','Rent + utilities on autopay so they can never be a surprise','Notice every purchase this week — just notice']},
    {id:'us',tag:'Us',
     vision:'The kind of partner someone builds a life with.',
     phase:'Now: show up steady.',
     week:['Friday date night — planned by you','Cook her dinner in the new place','Tell her about this system. One ally beats zero.']}
  ];

  /* ---------- inbox (written by Claude's /inbox sweep, fetched here) ---------- */
  var inbox=null;
  var loadInbox=function(){
    if(typeof fetch!=='function') return;
    fetch('inbox.json',{cache:'no-store'})
      .then(function(r){ return r.ok?r.json():null; })
      .then(function(j){ if(j&&typeof j==='object'){ inbox=j; render(); } })
      .catch(function(){});
  };

  /* ---------- agenda (repo items from Claude + local items from his phone) ---------- */
  var agendaRepo=null;
  var WOR={
    A:[['squat','Goblet squat','3×8'],['bench','Bench press or push-ups','3×8'],

  var allAgenda=function(){

    (agendaRepo||[]).forEach(function(it,i){
      out.push({id:'r:'+(it.id||i), src:'r', type:it.type||'todo',

  var DAYNAME=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var dayDiff=function(now,ds){
    if(!ds) return null;
    var p=String(ds).split('-');
    if(p.length!==3) return null;
    var d=new Date(+p[0],+p[1]-1,+p[2]);
    if(isNaN(d)) return null;
    var t=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    return Math.round((d-t)/86400000);
  };
  var dueLabel=function(n){
    if(n<0) return (-n===1)?'1 day late':((-n)+' days late');
    if(n===0) return 'today';
    if(n===1) return 'tomorrow';
    if(n<7) return 'in '+n+' days';
    if(n<14) return 'in a week';
    return 'in '+Math.round(n/7)+' weeks';
  };
  var dueClass=function(n){
    if(n<0) return 'late';
    if(n===0) return 'today';
    if(n<=3) return 'soon';
    return '';
  };

  var CHEVO='<svg class="chev open" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>';

  var esc=function(s){

  var inboxHTML=function(now){
    if(!inbox) return '';
    var items=Array.isArray(inbox.needsYou)?inbox.needsYou:[];
    var swept=inbox.swept?new Date(inbox.swept):null;
    var hrs=(swept&&!isNaN(swept))?Math.floor((now-swept)/3600000):null;
    var age='';
    if(hrs!==null) age = hrs<1?'just swept' : (hrs<24?('swept '+hrs+'h ago')
      : ('swept '+Math.floor(hrs/24)+'d ago'));
    var stale = hrs!==null && hrs>=72;

    var body;
    if(inbox.setup||!swept||isNaN(swept)){
      body='<p class="inbox-stale">Not sweeping yet. Install the Claude extension in Chrome, '
        +'then open Claude on your PC and say <b>/inbox</b>.</p>';
    }else if(stale){
      body='<p class="inbox-stale">Last sweep was '+age.replace('swept ','')
        +'. Open Claude and say <b>/inbox</b> to refresh.</p>';
    }else if(!items.length){
      body='<p class="inbox-clear">Nothing needs you. Inbox is handled.</p>';
    }else{
      body=items.slice(0,5).map(function(it){
        var due=it.due?('<span class="inbox-due'+(it.soon?' soon':'')+'">'+esc(it.due)+'</span>'):'';
        var who=it.who?('<span class="inbox-who">'+esc(it.who)+'</span>'):'';
        return '<div class="inbox-i">'+who+'<span>'+esc(it.what)+'</span>'+due+'</div>';
      }).join('');
      if(items.length>5){
        body+='<p class="inbox-foot">+'+(items.length-5)+' more in the sweep.</p>';
      }
    }
    var fyi=(typeof inbox.worthKnowing==='number'&&inbox.worthKnowing>0&&!stale)
      ? '<p class="inbox-foot">'+inbox.worthKnowing+' more worth knowing — nothing needed from you.</p>' : '';
    return '<section class="inbox"><div class="inbox-h">'
      +'<span class="inbox-t">Inbox</span><span class="inbox-age">'+esc(age)+'</span></div>'
      +body+fyi+'</section>';
  };

  var comingHTML=function(now){
    var done=agDone();
    var soon=allAgenda().filter(function(it){
      if(it.type!=='deadline'||done[it.id]) return false;
      var n=dayDiff(now,it.date);
      return n!==null && n<=7;
    }).map(function(it){ it._n=dayDiff(now,it.date); return it; })
      .sort(function(a,b){ return a._n-b._n; });

    return '<section class="inbox coming"><div class="inbox-h">'
      +'<span class="inbox-t">Coming up</span>'

      +soon.slice(0,4).map(function(it){
        return '<div class="inbox-i">'
          +(it.tag?'<span class="inbox-who">'+esc(it.tag)+'</span>':'')

      +(soon.length>4?'<p class="inbox-foot">+'+(soon.length-4)+' more on the Agenda tab.</p>':'')

  var agRow=function(it,now,done){

          +DAYNAME[new Date(+p[0],+p[1]-1,+p[2]).getDay()]+' '+(+p[1])+'/'+(+p[2])
          +(it.time?(' '+esc(it.time)):'')+'</span>';
      }
    }else if(it.type==='repeat'&&Array.isArray(it.days)&&it.days.length){
      var todayIs=it.days.indexOf(now.getDay())>=0;
      when='<span class="ag-when'+(todayIs?' today':'')+'">'
        +it.days.map(function(d){return DAYNAME[d]}).join(' · ')
        +(todayIs?' — that\'s today':'')+'</span>';
    }
    return '<div class="ag-i'+(on?' on':'')+'">'
      +(it.type==='note'?'<span class="ag-chk" style="border:0"></span>'
        :'<button class="ag-chk" data-act="agtoggle" data-id="'+esc(it.id)+'" aria-pressed="'+on+'" aria-label="Done">'
          +(on?CHECK:'')+'</button>')
      +'<span class="ag-txt">'+(it.tag?'<span class="ag-tag">'+esc(it.tag)+'</span>':'')
        +esc(it.text)+when+'</span>'
      +(it.src==='r'?'<span class="ag-src">Claude</span>'
        :'<button class="ag-del" data-act="agdel" data-id="'+esc(it.id)+'" aria-label="Delete">&times;</button>')
      +'</div>';

  var agSection=function(title,items,now,done,empty){

      +'</div></section>';

  var gradesHTML=function(now){
    if(!grades||!grades.courses.length) return '';
    var up=grades.updated?new Date(grades.updated):null;
    var hrs=(up&&!isNaN(up))?Math.floor((now-up)/3600000):null;

  var agendaHTML=function(now){

    if(adding){
      var TYPES=[['deadline','Deadline'],['todo','To-do'],['repeat','Repeats'],['note','Note']];
      html+='<div class="ag-form">'

        +(addType==='repeat'?'<div class="dayrow">'+DAYNAME.map(function(d,i){

  var headerHTML=function(now,st){

  var nowHTML=function(now,st){
    var blocks=dayBlocks(now);
    var nm=now.getHours()*60+now.getMinutes();
    var checks=st.checks;
    var won=MIN_IDS.every(function(id){return !!checks[id]});
    var html=won
      ? '<div class="won-banner">'+CHECK+' Day won — five for five. Everything past this is extra credit.</div>'
      : '';

    /* floor mode: the whole day is five checks */
    if(st.mode==='min'){
      var rows='';
      blocks.forEach(function(b){
        b.tasks.forEach(function(t){ if(t.min) rows+=floorRow(t,checks,t.hint||fmt(b.s)); });
      });
      html+='<section class="now">'
        +'<span class="chip quiet">floor mode</span>'
        +'<h2>Five checks. That\'s the whole day.</h2>'
        +'<p class="why">Rough days count too — the floor is how you win without burning out. Everything else is extra credit today.</p>'
        +'<div class="tasks">'+rows+'</div></section>';
      return html;
    }

    /* full mode: hero = the current block */
    var first=blocks[0], last=blocks[blocks.length-1];
    var cur=null, i;
    for(i=0;i<blocks.length;i++){
      if(nm>=mins(blocks[i].s)&&nm<mins(blocks[i].e)){cur=blocks[i];break;}
    }
    var chip,title,why,tasks,nextLabel;
    if(cur){
      chip=fmt(cur.s)+' &ndash; '+fmt(cur.e);
      title=cur.title; why=cur.why; tasks=cur.tasks;
      var nb=null;
      for(i=0;i<blocks.length;i++){ if(mins(blocks[i].s)>nm){nb=blocks[i];break;} }
      nextLabel=nb?(nb.title+' &middot; '+fmt(nb.s)):('Sleep &middot; '+fmt(cur.e));
    }else if(nm>=300&&nm<mins(first.s)){
      chip='early start'; title='Up early — bonus round';
      why='Water, light, food. The '+fmt(first.s)+' list unlocks whenever you start it.';
      tasks=first.tasks;
      nextLabel=blocks[1].title+' &middot; '+fmt(blocks[1].s);
    }else{
      var wakeRef;
      if(nm<300){ wakeRef=first; }
      else{
        var tm=new Date(now); tm.setDate(now.getDate()+1);
        wakeRef=dayBlocks(tm)[0];
      }
      chip='sleep'; title='Lights out';
      why='Nothing on the phone beats being sharp tomorrow.';
      tasks=(nm>=300)?last.tasks.filter(function(t){return t.id==='m-bed'}):[];
      nextLabel='Wake up &middot; '+fmt(wakeRef.s);
    }

    html+='<section class="now">'
      +'<span class="chip">'+chip+'</span>'
      +'<h2>'+title+'</h2>'
      +(why?'<p class="why">'+why+'</p>':'')
      +'<div class="tasks">'+tasks.map(function(t){return taskRow(t,checks,'task')}).join('')+'</div>'
      +'</section>';

    /* gentle catch-up for floor items from earlier blocks */
    var missed=[];
    blocks.forEach(function(b){
      if(mins(b.e)<=nm) b.tasks.forEach(function(t){ if(t.min&&!checks[t.id]) missed.push(t); });
    });
    if(missed.length && !won){
      html+='<div class="catch"><span class="catch-l">2-min catch-up:</span>'
        +missed.map(function(t){return '<button class="pill" data-act="task" data-id="'+t.id+'">'+t.short+'</button>'}).join('')
        +'</div>';
    }
    html+='<p class="upnext">Up next &middot; <b>'+nextLabel+'</b></p>';

    html+=comingHTML(now);
    html+=inboxHTML(now);

    /* timeline — today or tomorrow */
    var tmr=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
    var showT=(tlDay===1);
    var tblocks=showT?dayBlocks(tmr):blocks;

    html+='<div class="tlhead">'
      +'<button data-act="tlday" data-d="0" aria-current="'+(!showT)+'">Today</button>'
      +'<span class="sep">/</span>'
      +'<button data-act="tlday" data-d="1" aria-current="'+showT+'">Tomorrow</button>'
      +(showT?'<span class="dl">'+tmr.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})+'</span>':'')
      +'</div><div class="tl-wrap'+(showT?' tl-ro':'')+'">';

    tblocks.forEach(function(b){
      var open=!!expanded[(showT?'t:':'')+b.id];
      if(showT){
        html+='<div class="tl">'
          +'<button class="tl-h" data-act="expand" data-block="t:'+b.id+'" aria-expanded="'+open+'">'
          +'<span class="tl-time">'+fmt(b.s)+'</span>'
          +'<span class="tl-title">'+b.title+'</span>'
          +(open?CHEVO:CHEV)+'</button>'
          +(open?'<div class="tl-tasks">'+b.tasks.map(function(t){
              return '<div class="rotask"><span class="rodot"></span><span>'+t.label+'</span></div>';
            }).join('')+'</div>':'')
          +'</div>';
      }else{
        var done=b.tasks.filter(function(t){return !!checks[t.id]}).length;
        var total=b.tasks.length;
        var isCur=cur&&cur.id===b.id;
        html+='<div class="tl'+(isCur?' cur':'')+'">'
          +'<button class="tl-h" data-act="expand" data-block="'+b.id+'" aria-expanded="'+open+'">'
          +'<span class="tl-time">'+fmt(b.s)+'</span>'
          +'<span class="tl-title">'+b.title+'</span>'
          +'<span class="tl-count'+(done===total?' full':'')+'">'+done+'/'+total+'</span>'
          +(open?CHEVO:CHEV)+'</button>'
          +(open?'<div class="tl-tasks">'+b.tasks.map(function(t){return taskRow(t,checks,'task')}).join('')+'</div>':'')
          +'</div>';
      }
    });
    html+='</div>';
    return html;
  };

  var workoutHTML=function(now){
    var log=wLog();
    var wk=monday(now), wkKeys=weekKeys(wk);
    var thisWeek=log.filter(function(x){return wkKeys.indexOf(x.d)>=0}).length;
    var html='<div class="wo-l">';

        +'<div class="ag-btns"><button data-act="wocancel">Cancel</button>'
        +'<button class="go" data-act="wosave">Save workout</button></div></div></div>';
      return html;
    }

    html+='<div class="wo-top"><span class="wo-cnt">'
      +(log.length?(log.length+' logged &middot; '+thisWeek+' this week'):'No workouts logged yet')
      +'</span><span class="wo-next">Next: '+wNext()+'</span></div>';

    var lastAny=log.length?log[log.length-1]:null;
    if(lastAny){
      var p=lastAny.d.split('-');
      html+='<p class="wo-hint">Last session — workout '+lastAny.t+', '
        +DAYNAME[new Date(+p[0],+p[1]-1,+p[2]).getDay()]+' '+(+p[1])+'/'+(+p[2])+'</p>';
      WOR[lastAny.t].forEach(function(e){
        var v=lastAny.s&&lastAny.s[e[0]];
        if(v) html+='<div class="wo-last"><span class="wo-ex">'+e[1]+'</span>'
          +'<span class="wo-val">'+esc(v)+'</span></div>';
      });
    }else{
      html+='<p class="wo-none">Log your first one and the app will show you what to beat next time.</p>';
    }
    html+='<button class="wo-btn" data-act="woopen">Log a workout</button></div>';
    return html;
  };

  var moneyHTML=function(){
    if(!money) return '<div class="mny"><p class="mny-none">No spending data yet. '
      +'Export your Discover transactions to <b>C:\\Life\\money\\</b> and say <b>/money</b>.</p></div>';
    var spent=Number(money.spent)||0;
    var target=(money.target==null)?null:Number(money.target);
    var cats=Array.isArray(money.categories)?money.categories.slice(0,4):[];
    var max=cats.reduce(function(m,c){return Math.max(m,Number(c.amount)||0)},0)||1;
    var pct=target?Math.min(100,Math.round(spent/target*100)):0;
    var over=target&&spent>target;
    return '<div class="mny">'
      +'<div class="mny-h"><span class="mny-p">'+esc(money.period||'This month')+'</span>'
      +(target?('<span class="mny-t">'+pct+'% of $'+target+'</span>'):'')+'</div>'
      +'<div class="mny-n">$'+spent.toLocaleString()+'</div>'
      +(target?('<div class="mny-track"><span class="mny-fill'+(over?' over':'')
        +'" style="width:'+pct+'%"></span></div>'):'<div style="height:10px"></div>')
      +cats.map(function(c){
        var a=Number(c.amount)||0;
        return '<div class="mny-c"><span>'+esc(c.name)+'</span>'
          +'<span class="mny-bar"><span style="width:'+Math.round(a/max*100)+'%"></span></span>'
          +'<span class="mny-amt">$'+a.toLocaleString()+'</span></div>';
      }).join('')
      +(money.note?'<p class="mny-note">'+esc(money.note)+'</p>':'')
      +'</div>';
  };

  var goalsHTML=function(now){
    var mon=monday(now);
    var wk=dkey(mon);
    var ws=weekState(wk);
    var label=mon.toLocaleDateString(undefined,{month:'short',day:'numeric'});
    var html='<p class="wkline">Week of '+label+' &middot; refreshed at each Sunday review</p>';
    GOALS.forEach(function(g){
      var rows=g.week.map(function(lbl,i){
        return taskRow({id:g.id+'.'+i,label:lbl},ws.checks,'wktask');
      }).join('');
      html+='<section class="gcard">'
        +'<div class="eyebrow">'+g.tag+'</div>'
        +'<p class="vision">'+g.vision+'</p>'
        +'<p class="phase">'+g.phase+'</p>'
        +'<div class="tasks">'+rows+'</div>'
        +(g.id==='money'?moneyHTML():'')
        +(g.id==='body'?workoutHTML(now):'')
        +'</section>';
    });
    html+='<p class="gnote">These are the week\'s moves, not the whole mountain. Want one swapped? Tell Claude.</p>';
    return html;
  };

  var render=function(focusSel){
    var now=nowDate();
    var dk=dkey(now);
    var st=dayState(dk);
    var html=headerHTML(now,st);
    if(tab==='now') html+=nowHTML(now,st);
    else if(tab==='agenda') html+=agendaHTML(now);
    else if(tab==='goals') html+=goalsHTML(now);
    else html+=planHTML();
    html+='<footer>managed with Claude &middot; C:\\Life &middot; Sunday 1:30pm &mdash; weekly review</footer>';
    app.innerHTML=html;
    if(focusSel){
      var el=app.querySelector(focusSel);
      if(el) el.focus();
    }
  };

  app.addEventListener('click',function(e){
    var el=e.target.closest?e.target.closest('[data-act]'):null;
    if(!el) return;
    var act=el.getAttribute('data-act');
    var now=nowDate(), dk=dkey(now);
    if(act==='tab'){
      tab=el.getAttribute('data-tab'); render();
    }else if(act==='task'){
      var id=el.getAttribute('data-id');
      var s=dayState(dk);
      if(s.checks[id]) delete s.checks[id]; else s.checks[id]=true;
      saveDay(dk,s);
      render('[data-act][data-id="'+id+'"]');
    }else if(act==='wktask'){
      var wid=el.getAttribute('data-id');
      var wk=dkey(monday(now));
      var ws=weekState(wk);
      if(ws.checks[wid]) delete ws.checks[wid]; else ws.checks[wid]=true;
      saveWeek(wk,ws);
      render('[data-act][data-id="'+wid+'"]');
    }else if(act==='expand'){
      var b=el.getAttribute('data-block');
      expanded[b]=!expanded[b];
      render();
    }else if(act==='mode'){
      var s2=dayState(dk);
      s2.mode=(s2.mode==='min')?'full':'min';
      saveDay(dk,s2);
      render();
    }else if(act==='tlday'){
      tlDay=+el.getAttribute('data-d'); render();
    }else if(act==='woopen'){
      wOpen=true; wType=wNext(); render();
    }else if(act==='wocancel'){
      wOpen=false; render();
    }else if(act==='wotype'){
      wType=el.getAttribute('data-t'); render();
    }else if(act==='wosave'){
      var sets={}, any=false;
      WOR[wType].forEach(function(e){
        var inp=document.getElementById('wo-'+e[0]);
        var v=inp?inp.value.trim():'';
        if(v){ sets[e[0]]=v; any=true; }
      });
      if(any){
        var lg=wLog();
        lg.push({d:dkey(now),t:wType,s:sets});
        wSave(lg);
      }
      wOpen=false; render();
    }else if(act==='agopen'){
      adding=true; render('#agtext');
    }else if(act==='agcancel'){
      resetForm(); render();
    }else if(act==='agtype'){
      syncForm(); addType=el.getAttribute('data-type'); render('#agtext');
    }else if(act==='agday'){
      syncForm();
      var d=+el.getAttribute('data-day');
      var at=addDays.indexOf(d);
      if(at>=0) addDays.splice(at,1); else addDays.push(d);
      addDays.sort();
      render('#agtext');
    }else if(act==='agsave'){
      syncForm();
      var text=(addText||'').trim();
      if(!text){ render('#agtext'); return; }
      var item={id:'m:'+Date.now(),type:addType,text:text};
      if(addType==='deadline'){
        if(!addDate){ render('#agdate'); return; }
        item.date=addDate;
      }
      if(addType==='repeat'){
        if(!addDays.length){ render('#agtext'); return; }
        item.days=addDays.slice();
      }
      var mine=myItems(); mine.push(item); saveMine(mine);
      resetForm(); render();
    }else if(act==='agtoggle'){
      var aid=el.getAttribute('data-id');
      var dn=agDone();
      if(dn[aid]) delete dn[aid]; else dn[aid]=true;
      saveDone(dn);
      render('[data-act="agtoggle"][data-id="'+aid.replace(/"/g,'\\"')+'"]');
    }else if(act==='agdel'){
      var did=el.getAttribute('data-id');
      saveMine(myItems().filter(function(x){return x.id!==did}));
      var dn2=agDone(); delete dn2[did]; saveDone(dn2);
      render();
    }
  });

  setInterval(function(){ if(!adding && !wOpen) render(); },30000);
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden && !adding && !wOpen){ render(); loadInbox(); loadAgenda(); loadMoney(); loadGrades(); }
  });
  render();
  loadInbox();
  loadAgenda();
  loadMoney();
  loadGrades();
})();
